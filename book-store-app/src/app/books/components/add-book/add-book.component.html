<form #myForm="ngForm" (ngSubmit)="saveBook()" class="add-book-form">
    <mat-form-field appearance="fill">
        <mat-label>Title</mat-label>
        <input matInput type="text" name="title" placeholder="Title" [(ngModel)]="model.title" required maxlength="50"
            minlength="10" #bookTitle="ngModel">
        <mat-icon matSuffix>title</mat-icon>
        <mat-hint *ngIf="bookTitle.invalid && bookTitle.touched" formControlName="fo">
            <span *ngIf="bookTitle.errors?.required">Please enter the book title</span>
            <span *ngIf="bookTitle.errors?.minlength">Min length is 10 and max length is 1000</span>
        </mat-hint>
    </mat-form-field>

    <mat-form-field appearance="fill">
        <input matInput type="text" name="author" placeholder="Author" [(ngModel)]="model.author" required
            #author="ngModel">
        <mat-icon matSuffix>person</mat-icon>
        <mat-hint *ngIf="author.invalid && author.touched">Please enter author name</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="fill">
        <input matInput type="number" name="pages" placeholder="Pages" [(ngModel)]="model.totalPages" max="1000"
            min="10" #totalPages="ngModel">
        <mat-icon matSuffix>123</mat-icon>
        <mat-hint [hidden]="totalPages.valid">Valid length is 10 to 1000</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="fill">
        <!--<input matInput type="number" name="price" placeholder="Price" ngModel>-->
        <mat-select type="number" name="price" placeholder="Price" [(ngModel)]="model.price.value">
            <mat-option *ngFor="let price of prices" [value]="price.value">
                {{price.viewValue}}
            </mat-option>
        </mat-select>
        <mat-icon matSuffix>attach_money</mat-icon>
        <!--<mat-hint>Hint</mat-hint>-->
    </mat-form-field>

    <mat-form-field appearance="fill">
        <mat-label>Choose a date</mat-label>
        <input matInput [matDatepicker]="picker" name="publishedOn" [(ngModel)]="model.publishedOn">
        <mat-hint>MM/DD/YYYY</mat-hint>
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-slide-toggle class="toggle" name="isPublished" [(ngModel)]="model.isPublished">Slide me!</mat-slide-toggle>

    <button mat-raised-button color="primary" type="submit" [disabled]="myForm.invalid">Save</button>
</form>
